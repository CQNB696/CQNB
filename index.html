* {

}

body {

    background: linear-gradient(135deg, #2a3b52 0%, #597092 40%, #b4c6e0 70%, #f5f7fa 100%);
    overflow-x: hidden;
    font-family: "Microsoft YaHei", sans-serif;
    text-align: center;
    position: relative;
    padding-top: 40px;
}

.snow {
    position: fixed;
    top: -40px;
    color: #c8d6e8;
    font-size: 30px;
    pointer-events: none;
    z-index: 9999;
    animation: snowFall linear infinite;

}
@keyframes snowFall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(100vh) rotate(360deg); }
}

.avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 15px auto;
    border: 3px solid #c8d6e8;
}

.header-text {
    margin-bottom: 30px;
}

.text-lg {
    font-size: 1.5em;
    font-weight: 600;
    color: #ffffff;
    text-shadow: 
        1px 1px 0 #40a9ff,
        -1px -1px 0 #40a9ff,
        1px -1px 0 #40a9ff,
        -1px 1px 0 #40a9ff,
        0 0 6px #69b1ff,
        0 0 10px #93c5fd;
    letter-spacing: 1px;
}
.text-normal {
    font-size: 1em;
    color: #555;
    margin: 8px 0;
    letter-spacing: 0.5px;
}
.text-plain {
    font-size: 1em;
    color: #e2e8f0;
    text-shadow: none;
    font-weight: normal;
    margin-top: 10px;

.main-card {
    background: #ffffff;
    width: 92%;
    max-width: 520px;
    margin: 0 auto 45px auto;
    padding: 45px 25px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(35, 50, 70, 0.25);
    position: relative;
    z-index: 10;
}

.btn-wrap {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin-bottom: 14px;
}
.btn-item {
    width: 42%;
    margin: 0;
}

.btn {
    display: block;
    padding: 15px 0;
    border-radius: 16px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    color: #fff;
    background: linear-gradient(135deg, #3c4e68, #506688);
    box-shadow: 0 5px 12px rgba(35, 50, 70, 0.35),
                inset 0 1px 0 rgba(255,255,255,0.15);
    transition: all 0.18s ease;
    border: none;
}
.btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 6px rgba(35, 50, 70, 0.25);
}

.mt35 { margin-top: 35px; }

<script>
function createSnow(){const snow=document.createElement("div");snow.className="snow";snow.innerText="❄️";snow.style.left=Math.random()*100+"%";let s=Math.random()*6+5;snow.style.animationDuration=s+"s";document.body.appendChild(snow);setTimeout(()=>snow.remove(),s*1000)}
